# nginx proxy address - no HTTP interface, the broker publishes its native 1883 port

name: mqtt
x-logging: &default-logging
  options:
    max-size: '5m'
    max-file: '1'
  driver: json-file

services:
  app:
    image: eclipse-mosquitto:latest
    container_name: mqtt-app
    domainname: ${BASE_DOMAIN_NAME:-example.com}
    hostname: ${BASE_HOST_NAME:-$HOSTNAME}
    restart: always
    pull_policy: always
    tty: true
    stdin_open: true
    logging: *default-logging
    environment:
      TZ: ${TZ:-America/New_York}
      CONTAINER_NAME: mqtt-app
      HOSTNAME: ${BASE_HOST_NAME:-$HOSTNAME}
    healthcheck:
      test: ['CMD', 'nc', '-z', '127.0.0.1', '1883']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    ports:
      - '1883:1883'
    volumes:
      - './volumes/data/mqtt:/mosquitto/data:z'
      - './volumes/config/mqtt:/mosquitto/config:z'
      - './volumes/data/log/mqtt:/mosquitto/log:z'
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - mqtt

networks:
  mqtt:
    name: mqtt
    external: false
